{# Table structure for locality point metadata #}

                <section class="table_of_contents" id="toc">
                    <button class="toc_button button" id="toc_button">Contents</button>
                    <div class="content">
                        <h3>Locality Points</h3>
                        <ol>
                        {% for point in locality_points.values() %}
                            <li><a href="#{{ point.name }}">
                                {{point.name}} - {{ point.locality_type_code }}{% if point.map_face_note is not none %} ({{ point.map_face_note }}){% endif %}
                            </a></li>
                        {% endfor %}
                        </ol>
                    </div>
                </section>

# Environment file with the packages that we require.
name: fdc
channels:
  - https://nexus-internal.bgs.ac.uk/repository/conda-forge
  # Labelled repository gives access to different file versions
  - https://nexus-internal.bgs.ac.uk/repository/conda-forge/label/qgis_ltr
dependencies:
  # Correspond to current long-term support versions in Windows
  - python=3.12
  - qgis=3.40.11

  - beautifulsoup4
  - eralchemy
  - exifread
  - flake8
  - ipdb
  - ipython
  - Jinja2
  - lxml
  - pandas
  - pillow
  - pip  # Required to make sure that conda uses the correct pip
  - pytest
  - rdflib
  - reportlab
  - sqlalchemy
  - pypdf

  - pip:
      - etlhelper
      - mergin-client
      - pb_tool

# Environment file with the packages that we require.
name: crag
channels:
  - conda-forge
  # Labelled repository gives access to different file versions
  - conda-forge/label/qgis_ltr
dependencies:
  # Correspond to current long-term support versions in Windows
  - python=3.12
  - qgis=3.44.9

  - beautifulsoup4
  - eralchemy
  - exifread
  - flake8
  - ipdb
  - ipython
  - Jinja2
  - lxml
  - pandas
  - pillow
  - pip  # Required to make sure that conda uses the correct pip
  - pytest
  - rdflib
  - reportlab
  - sqlalchemy
  - pypdf
  - sphinx
  - sphinx-copybutton
  - sphinx-subfigure
  - myst-parser
  - rinohtype

  - pip:
      - etlhelper
      - mergin-client
      - pb_tool==3.1.0
      - rinoh-typeface-texgyreheros

# Environment file with the packages that we require.
name: crag
channels:
  - conda-forge
  # Labelled repository gives access to different file versions
  - conda-forge/label/qgis_ltr
dependencies:
  # Correspond to current long-term support versions in Windows
  - python=3.12
  - qgis=3.44.11

  # CRAG dependencies that are bundled with QGIS by Windows installer
  - exifread
  - Jinja2
  - lxml
  - pandas
  - pillow
  - pip  # Required to make sure that conda uses the correct pip
  - reportlab

  # Packages used for support and testing
  - beautifulsoup4
  - eralchemy
  - flake8
  - ipdb
  - ipython
  - pytest
  - rdflib
  - sqlalchemy
  - pypdf

  # Packages used to generate user documentation
  - sphinx
  - sphinx-copybutton
  - sphinx-subfigure
  - sphinx-book-theme
  - myst-parser

  - pip:
      # Packages used for support and testing
      - etlhelper
      - mergin-client
      - pb_tool==3.1.0

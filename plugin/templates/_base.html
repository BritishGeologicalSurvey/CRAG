<!doctype html>
<html lang="en">
    <head>
        <title>{% block title %}{% endblock %}</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href=".field_data_capture/css/style.css">
    </head>
    <body>
    {% block body %}
    {% endblock %}
    <script>
        // Collapsible sections, derived from: https://www.w3schools.com/howto/howto_js_collapsible.asp
        var coll = document.getElementsByClassName("collapsible");
        var i;

        for (i = 0; i < coll.length; i++) {
            coll[i].addEventListener("click", function() {
                this.classList.toggle("active");
                var content = this.nextElementSibling;
                if (content.style.maxHeight){
                content.style.maxHeight = null;
                } else {
                content.style.maxHeight = content.scrollHeight + "px";
                }
            });
        }

        const toc_button = document.getElementById("toc_button");
        toc_button.addEventListener("click", function() {
            this.classList.toggle("active");
            var content = this.nextElementSibling;
            if (content.style.maxHeight){
              content.style.maxHeight = null;
            } else {
              content.style.maxHeight = content.scrollHeight + "px";
            }
        });

        const expand_all = document.getElementById("expand_all");
        expand_all.addEventListener("click", function() {
            for (i = 0; i < coll.length; i++) {
                coll[i].classList.add("active");
                var content = coll[i].nextElementSibling;
                content.style.maxHeight = content.scrollHeight + "px";
            }
        });

        const collapse_all = document.getElementById("collapse_all");
        collapse_all.addEventListener("click", function () {
            for (i = 0; i < coll.length; i++) {
                coll[i].classList.remove("active");
                var content = coll[i].nextElementSibling;
                content.style.maxHeight = null;
            }
        });
    </script>
</body>
</html>

{# Table structure for locality point metadata #}

                <section class="table_of_contents">
                    <button class="collapsible">Contents</button>
                    <div class="content">
                        <h3>Locality Points</h3>
                        <ul>
                        {% for point in locality_points.values() %}
                            <li><a href="#{{ point.name }}">
                                {{point.name}} - {{ point.exposure_type_code }}{% if point.map_face_note is not none %} ({{ point.map_face_note }}){% endif %}
                            </a></li>
                        {% endfor %}
                        </ul>
                    </div>
                </section>

{% extends "_base.html" %}
{% block title %}Field_Report{% endblock %}
{% block body %}

        <section>
            <h2>Field Report</h2>
        </section>

        {% for point in locality_points %}
        <section class="locality_point">
            <h3>Locality point {{ point.name }}</h3>
            <table>
                <tr>
                    <th>Field</th>
                    <th>Value</th>
                </tr>
                {% for key, value in point.items() %}
                <tr>
                    <td>{{ key }}</td>
                    <td>{{ value }}</td>
                </tr>
                {% endfor %}
            </table>
        </section>
        {% endfor %}

{% endblock %}

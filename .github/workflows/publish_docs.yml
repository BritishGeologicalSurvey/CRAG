name: Publish Plugin Docs

on:
  release:
    types:
      - released

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3  # v6

    - name: Cache Python packages
      uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0  # v5
      env:
        # Increase this value to reset cache if environment file has not changed
        CACHE_NUMBER: 1
      with:
        path: |
          ~/conda_pkgs_dir
          ~/.cache/pip
        key:
          ${{ runner.os }}-conda-${{ env.CACHE_NUMBER }}-${{
          hashFiles('environment_unversioned.yml') }}

    - name: Activate Anaconda Environment
      uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5  # v4.0.1
      with:
        miniforge-version: latest
        environment-file: environment_unversioned.yml
        activate-environment: crag
        auto-activate-base: false
        use-only-tar-bz2: true # IMPORTANT: This needs to be set for caching to work properly!
      env:
        CONDA_OVERRIDE_ARCHSPEC: x86_64_v4

    - name: Build HTML
      shell: bash -l {0}
      run: |
        sphinx-build -M html docs/user_guide/source/ docs/user_guide/build/

    - name: Setup Pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

    - name: Upload Artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  #v5.0.0
      with:
        path: "docs/user_guide/build/html/"

  deploy-docs:
    runs-on: ubuntu-latest
    needs: build-docs
    
    permissions:
      pages: write
      id-token: write

    environment:
      # environment created automatically by GitHub
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0

name: Security Scan

on:
  push:
    branches:
      - "*"
    paths:
      - 'CRAG/**.py'
      - '.github/workflows/security_scan.yml'

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3  # v6

    - name: Set up Python
      uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        # Upgrade pip and install bandit
        python -m pip install --upgrade pip
        pip install bandit detect-secrets

    - name: Bandit Scan
      # Scan the CRAG folder for vulnerabilities
      run: bandit -r ./CRAG/ -ll

    - name: Detect Secrets
      # Scan the plugin directory for hardcoded secrets/credentials
      run: detect-secrets scan ./CRAG/ --all-files
